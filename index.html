<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinançasPro — Gestão Financeira Pessoal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e2a;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #eef0f7;
    --text2: #8b91a8;
    --text3: #555b73;
    --accent: #4ade80;
    --accent2: #22c55e;
    --danger: #f87171;
    --danger2: #ef4444;
    --blue: #60a5fa;
    --blue2: #3b82f6;
    --gold: #fbbf24;
    --radius: 14px;
    --radius-sm: 8px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  /* HEADER */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-dot {
    width: 10px; height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent2);
  }
  .header-actions { display: flex; gap: 10px; align-items: center; }
  /* LAYOUT */
  .app { max-width: 1100px; margin: 0 auto; padding: 28px 20px 80px; }
  /* SUMMARY CARDS */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 28px;
  }
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--border2); }
  .card-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .card-dot {
    width: 7px; height: 7px; border-radius: 50%;
  }
  .card-value {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    margin-bottom: 4px;
  }
  .card-sub { font-size: 12px; color: var(--text3); }
  .card-receita .card-value { color: var(--accent); }
  .card-despesa .card-value { color: var(--danger); }
  .card-saldo .card-value { color: var(--blue); }
  /* CHART */
  .chart-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .chart-title {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text2);
    margin-bottom: 16px;
    letter-spacing: 0.03em;
  }
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-name { font-size: 12px; color: var(--text2); width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
  .bar-track { flex: 1; height: 8px; background: var(--bg3); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.6s cubic-bezier(0.4,0,0.2,1); }
  .bar-val { font-size: 12px; color: var(--text2); width: 72px; text-align: right; flex-shrink: 0; }
  /* MINI DONUT */
  .donut-wrap { display: flex; align-items: center; gap: 24px; }
  .donut-svg { flex-shrink: 0; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-pct { margin-left: auto; font-weight: 500; color: var(--text); font-size: 13px; padding-left: 12px; }
  /* CONTROLS */
  .controls-bar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    pointer-events: none;
  }
  input[type="text"], input[type="number"], input[type="date"], select {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 9px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }
  input:focus, select:focus { border-color: var(--border2); }
  .search-input { padding-left: 38px; }
  .filter-btn {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 9px 16px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .filter-btn:hover, .filter-btn.active { border-color: var(--border2); color: var(--text); background: var(--bg3); }
  .filter-btn.active-receita { border-color: var(--accent2); color: var(--accent); }
  .filter-btn.active-despesa { border-color: var(--danger2); color: var(--danger); }
  /* TABLE */
  .table-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .table-header-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 90px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text3);
  }
  .transaction-row {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr 90px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
    animation: rowIn 0.3s ease;
  }
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: none; }
  }
  .transaction-row:last-child { border-bottom: none; }
  .transaction-row:hover { background: var(--bg3); }
  .t-desc { font-size: 14px; color: var(--text); }
  .t-cat { font-size: 12px; color: var(--text3); }
  .t-date { font-size: 13px; color: var(--text2); }
  .t-type span {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .badge-receita { background: rgba(74,222,128,0.12); color: var(--accent); }
  .badge-despesa { background: rgba(248,113,113,0.12); color: var(--danger); }
  .t-valor { font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600; }
  .t-valor.receita { color: var(--accent); }
  .t-valor.despesa { color: var(--danger); }
  .t-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-icon {
    background: none;
    border: none;
    color: var(--text3);
    cursor: pointer;
    padding: 4px;
    border-radius: 6px;
    transition: all 0.15s;
    display: flex; align-items: center;
  }
  .btn-icon:hover { color: var(--text); background: rgba(255,255,255,0.07); }
  .btn-icon.del:hover { color: var(--danger); }
  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 20px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    transform: translateY(20px);
    transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1);
  }
  .modal-overlay.open .modal { transform: translateY(0); }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .form-group { margin-bottom: 16px; }
  .form-label { font-size: 12px; font-weight: 500; color: var(--text2); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px; display: block; }
  .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .type-btn {
    padding: 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .type-btn.active-rec { border-color: var(--accent2); color: var(--accent); background: rgba(74,222,128,0.1); }
  .type-btn.active-desp { border-color: var(--danger2); color: var(--danger); background: rgba(248,113,113,0.1); }
  /* PRIMARY BUTTON */
  .btn-primary {
    background: var(--accent);
    color: #0a0f0a;
    border: none;
    border-radius: var(--radius-sm);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 12px 24px;
    cursor: pointer;
    width: 100%;
    transition: all 0.15s;
    letter-spacing: 0.03em;
    margin-top: 4px;
  }
  .btn-primary:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn-primary:active { transform: none; }
  /* FAB */
  .fab {
    position: fixed;
    bottom: 28px;
    right: 24px;
    width: 56px;
    height: 56px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    color: #0a0f0a;
    font-size: 28px;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(74,222,128,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    z-index: 50;
  }
  .fab:hover { background: var(--accent2); transform: scale(1.08) rotate(90deg); }
  /* EMPTY */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text3);
  }
  .empty-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
  .empty p { font-size: 14px; }
  /* TOAST */
  .toast {
    position: fixed;
    bottom: 96px;
    right: 24px;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text);
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.3s;
    z-index: 300;
    pointer-events: none;
  }
  .toast.show { transform: none; opacity: 1; }
  /* SECTION TITLE */
  .section-title {
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--text2);
    letter-spacing: 0.04em;
    margin-bottom: 14px;
    text-transform: uppercase;
  }
  /* RESPONSIVE */
  @media (max-width: 700px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
    .summary-grid .card-saldo { grid-column: 1 / -1; }
    .chart-row { grid-template-columns: 1fr; }
    .table-header-row, .transaction-row { grid-template-columns: 2fr 1fr 80px; }
    .th-cat, .t-cat-col, .th-tipo, .t-tipo-col { display: none; }
    header { padding: 0 16px; }
    .app { padding: 20px 14px 80px; }
    .card-value { font-size: 22px; }
  }
  @media (max-width: 420px) {
    .table-header-row, .transaction-row { grid-template-columns: 1fr 80px; }
    .th-date, .t-date-col { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-dot"></div>
    FinançasPro
  </div>
  <div class="header-actions">
    <span id="header-date" style="font-size:13px;color:var(--text3);"></span>
  </div>
</header>

<div class="app">
  <!-- SUMMARY CARDS -->
  <div class="summary-grid" id="summary-grid">
    <div class="card card-receita">
      <div class="card-label"><div class="card-dot" style="background:var(--accent)"></div> Total Receitas</div>
      <div class="card-value" id="total-receita">R$ 0,00</div>
      <div class="card-sub" id="count-receita">0 lançamentos</div>
    </div>
    <div class="card card-despesa">
      <div class="card-label"><div class="card-dot" style="background:var(--danger)"></div> Total Despesas</div>
      <div class="card-value" id="total-despesa">R$ 0,00</div>
      <div class="card-sub" id="count-despesa">0 lançamentos</div>
    </div>
    <div class="card card-saldo">
      <div class="card-label"><div class="card-dot" style="background:var(--blue)"></div> Saldo / Lucro</div>
      <div class="card-value" id="total-saldo">R$ 0,00</div>
      <div class="card-sub" id="saldo-status">–</div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="chart-row">
    <div class="chart-card">
      <div class="chart-title">Top categorias — despesas</div>
      <div class="bar-chart" id="bar-chart-desp">
        <div class="empty" style="padding:20px"><div class="empty-icon">📊</div><p>Sem dados ainda</p></div>
      </div>
    </div>
    <div class="chart-card">
      <div class="chart-title">Distribuição receita × despesa</div>
      <div class="donut-wrap" id="donut-wrap">
        <svg class="donut-svg" id="donut-svg" width="100" height="100" viewBox="0 0 100 100" role="img" aria-label="Gráfico de distribuição">
          <circle cx="50" cy="50" r="38" fill="none" stroke="var(--bg3)" stroke-width="14"/>
          <circle id="donut-rec" cx="50" cy="50" r="38" fill="none" stroke="var(--accent)" stroke-width="14" stroke-dasharray="0 239" stroke-dashoffset="60" stroke-linecap="round" style="transition:stroke-dasharray 0.6s ease"/>
          <circle id="donut-desp" cx="50" cy="50" r="38" fill="none" stroke="var(--danger)" stroke-width="14" stroke-dasharray="0 239" stroke-dashoffset="60" stroke-linecap="round" style="transition:stroke-dasharray 0.6s ease;transition-delay:0.2s"/>
        </svg>
        <div class="donut-legend" id="donut-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--accent)"></div>Receitas<span class="legend-pct" id="pct-rec">–</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>Despesas<span class="legend-pct" id="pct-desp">–</span></div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Saldo<span class="legend-pct" id="pct-saldo">–</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTROLS -->
  <div class="section-title">Lançamentos</div>
  <div class="controls-bar">
    <div class="search-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="search" placeholder="Buscar por descrição ou categoria…">
    </div>
    <button class="filter-btn active" id="btn-all" onclick="setFilter('all')">Todos</button>
    <button class="filter-btn" id="btn-receita" onclick="setFilter('receita')">Receitas</button>
    <button class="filter-btn" id="btn-despesa" onclick="setFilter('despesa')">Despesas</button>
    <select id="filter-mes" onchange="renderList()" style="width:auto;min-width:130px;">
      <option value="">Todos os meses</option>
    </select>
  </div>

  <!-- TABLE -->
  <div class="table-card">
    <div class="table-header-row">
      <div>Descrição</div>
      <div class="th-cat">Categoria</div>
      <div class="th-date">Data</div>
      <div class="th-tipo">Tipo</div>
      <div style="text-align:right">Valor</div>
    </div>
    <div id="transactions-list"></div>
  </div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()" title="Novo lançamento" aria-label="Adicionar lançamento">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeOnBackdrop(event)">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-h">
    <div class="modal-title">
      <span id="modal-h">Novo Lançamento</span>
      <button class="btn-icon" onclick="closeModal()" aria-label="Fechar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="type-toggle">
      <button class="type-btn active-rec" id="btn-tipo-rec" onclick="setTipo('receita')">↑ Receita</button>
      <button class="type-btn" id="btn-tipo-desp" onclick="setTipo('despesa')">↓ Despesa</button>
    </div>
    <div class="form-group">
      <label class="form-label" for="f-desc">Descrição</label>
      <input type="text" id="f-desc" placeholder="Ex: Salário, Aluguel, Supermercado…">
    </div>
    <div class="form-group">
      <label class="form-label" for="f-val">Valor (R$)</label>
      <input type="number" id="f-val" placeholder="0,00" min="0.01" step="0.01">
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group">
        <label class="form-label" for="f-cat">Categoria</label>
        <input type="text" id="f-cat" placeholder="Ex: Alimentação…" list="cat-list">
        <datalist id="cat-list"></datalist>
      </div>
      <div class="form-group">
        <label class="form-label" for="f-date">Data</label>
        <input type="date" id="f-date">
      </div>
    </div>
    <button class="btn-primary" onclick="saveTransaction()">Salvar Lançamento</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ─── STATE ───────────────────────────────────────────────
const STORAGE_KEY = 'financaspro_v2';
let transactions = [];
let editingId = null;
let currentFilter = 'all';
let currentTipo = 'receita';

// ─── LOAD / SAVE ─────────────────────────────────────────
function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) transactions = JSON.parse(raw);
  } catch(e) { transactions = []; }
}
function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(transactions));
}

// ─── FORMAT ──────────────────────────────────────────────
function fmt(n) {
  return n.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
}
function fmtDate(d) {
  if (!d) return '–';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function monthLabel(d) {
  if (!d) return '';
  const [y,m] = d.split('-');
  const months = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${months[parseInt(m,10)-1]} ${y}`;
}

// ─── TOTALS ───────────────────────────────────────────────
function calcTotals(list) {
  let rec = 0, desp = 0;
  list.forEach(t => {
    if (t.tipo === 'receita') rec += t.valor;
    else desp += t.valor;
  });
  return { rec, desp, saldo: rec - desp };
}

// ─── DONUT ────────────────────────────────────────────────
function updateDonut(rec, desp) {
  const total = rec + desp;
  const C = 2 * Math.PI * 38; // ≈ 238.76
  const dRec = total ? (rec / total) * C : 0;
  const dDesp = total ? (desp / total) * C : 0;
  const gapRec = C - dRec;
  const gapDesp = C - dDesp;
  const offsetDesp = C * 0.25 - dRec + C;
  document.getElementById('donut-rec').setAttribute('stroke-dasharray', `${dRec} ${gapRec}`);
  document.getElementById('donut-desp').setAttribute('stroke-dasharray', `${dDesp} ${gapDesp}`);
  document.getElementById('donut-desp').setAttribute('stroke-dashoffset', `${-dRec + C * 0.25}`);
  const pRec = total ? Math.round(rec / total * 100) : 0;
  const pDesp = total ? Math.round(desp / total * 100) : 0;
  const saldo = rec - desp;
  document.getElementById('pct-rec').textContent = `${pRec}%`;
  document.getElementById('pct-desp').textContent = `${pDesp}%`;
  document.getElementById('pct-saldo').textContent = fmt(saldo);
}

// ─── BAR CHART ────────────────────────────────────────────
function updateBarChart(list) {
  const cats = {};
  list.filter(t => t.tipo === 'despesa').forEach(t => {
    const c = t.categoria || 'Outros';
    cats[c] = (cats[c] || 0) + t.valor;
  });
  const sorted = Object.entries(cats).sort((a,b) => b[1]-a[1]).slice(0,5);
  const el = document.getElementById('bar-chart-desp');
  if (!sorted.length) {
    el.innerHTML = '<div class="empty" style="padding:20px"><div class="empty-icon">📊</div><p>Sem despesas</p></div>';
    return;
  }
  const max = sorted[0][1];
  const colors = ['#f87171','#fb923c','#fbbf24','#a78bfa','#60a5fa'];
  el.innerHTML = sorted.map(([name, val], i) => `
    <div class="bar-row">
      <div class="bar-name" title="${name}">${name}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(val/max*100)}%;background:${colors[i%colors.length]}"></div></div>
      <div class="bar-val">${fmt(val)}</div>
    </div>
  `).join('');
}

// ─── MONTH FILTER ─────────────────────────────────────────
function updateMonthFilter() {
  const months = [...new Set(transactions.map(t => t.data ? t.data.substring(0,7) : null).filter(Boolean))].sort().reverse();
  const sel = document.getElementById('filter-mes');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todos os meses</option>' + months.map(m => {
    const [y,mo] = m.split('-');
    const labels = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
    return `<option value="${m}" ${cur===m?'selected':''}>${labels[parseInt(mo,10)-1]} ${y}</option>`;
  }).join('');
}

// ─── DATALIST ─────────────────────────────────────────────
function updateDatalist() {
  const cats = [...new Set(transactions.map(t => t.categoria).filter(Boolean))];
  document.getElementById('cat-list').innerHTML = cats.map(c => `<option value="${c}">`).join('');
}

// ─── RENDER ───────────────────────────────────────────────
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const mes = document.getElementById('filter-mes').value;
  return transactions.filter(t => {
    if (currentFilter !== 'all' && t.tipo !== currentFilter) return false;
    if (mes && (!t.data || !t.data.startsWith(mes))) return false;
    if (q) {
      const hay = `${t.descricao} ${t.categoria}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderSummary(list) {
  const all = calcTotals(transactions);
  const { rec, desp, saldo } = all;
  document.getElementById('total-receita').textContent = fmt(rec);
  document.getElementById('total-despesa').textContent = fmt(desp);
  document.getElementById('total-saldo').textContent = fmt(saldo);
  const recCount = transactions.filter(t => t.tipo === 'receita').length;
  const despCount = transactions.filter(t => t.tipo === 'despesa').length;
  document.getElementById('count-receita').textContent = `${recCount} lançamento${recCount !== 1 ? 's' : ''}`;
  document.getElementById('count-despesa').textContent = `${despCount} lançamento${despCount !== 1 ? 's' : ''}`;
  const saldoEl = document.getElementById('total-saldo');
  saldoEl.style.color = saldo >= 0 ? 'var(--blue)' : 'var(--gold)';
  document.getElementById('saldo-status').textContent = saldo >= 0 ? 'Situação positiva ✓' : 'Atenção: saldo negativo';
  updateDonut(rec, desp);
  updateBarChart(transactions);
}

function renderList() {
  const list = getFiltered().slice().sort((a,b) => (b.data||'') > (a.data||'') ? 1 : -1);
  const el = document.getElementById('transactions-list');
  if (!list.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><p>Nenhum lançamento encontrado</p></div>';
    return;
  }
  el.innerHTML = list.map(t => `
    <div class="transaction-row">
      <div>
        <div class="t-desc">${esc(t.descricao)}</div>
        <div class="t-cat t-cat-col">${esc(t.categoria || '–')}</div>
      </div>
      <div class="t-cat-col"><span style="font-size:12px;color:var(--text2)">${esc(t.categoria || '–')}</span></div>
      <div class="t-date-col t-date">${fmtDate(t.data)}</div>
      <div class="t-tipo-col t-type"><span class="badge-${t.tipo}">${t.tipo === 'receita' ? '↑ Receita' : '↓ Despesa'}</span></div>
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px">
        <span class="t-valor ${t.tipo}">${t.tipo === 'receita' ? '+' : '-'}${fmt(t.valor)}</span>
        <div class="t-actions">
          <button class="btn-icon" onclick="editTransaction('${t.id}')" title="Editar" aria-label="Editar">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          </button>
          <button class="btn-icon del" onclick="deleteTransaction('${t.id}')" title="Excluir" aria-label="Excluir">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

function render() {
  const list = getFiltered();
  renderSummary(list);
  renderList();
  updateMonthFilter();
}

// ─── ESC ──────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── FILTER ───────────────────────────────────────────────
function setFilter(f) {
  currentFilter = f;
  ['all','receita','despesa'].forEach(k => {
    const btn = document.getElementById(`btn-${k}`);
    btn.className = 'filter-btn';
    if (k === f) btn.classList.add('active', k === 'receita' ? 'active-receita' : k === 'despesa' ? 'active-despesa' : '');
  });
  renderList();
}

// ─── MODAL ────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  const t = id ? transactions.find(x => x.id === id) : null;
  document.getElementById('modal-h').textContent = id ? 'Editar Lançamento' : 'Novo Lançamento';
  setTipo(t ? t.tipo : 'receita');
  document.getElementById('f-desc').value = t ? t.descricao : '';
  document.getElementById('f-val').value = t ? t.valor : '';
  document.getElementById('f-cat').value = t ? (t.categoria || '') : '';
  document.getElementById('f-date').value = t ? (t.data || today()) : today();
  updateDatalist();
  document.getElementById('modal-overlay').classList.add('open');
  setTimeout(() => document.getElementById('f-desc').focus(), 250);
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}
function closeOnBackdrop(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
}
function setTipo(tipo) {
  currentTipo = tipo;
  document.getElementById('btn-tipo-rec').className = 'type-btn' + (tipo === 'receita' ? ' active-rec' : '');
  document.getElementById('btn-tipo-desp').className = 'type-btn' + (tipo === 'despesa' ? ' active-desp' : '');
}

// ─── CRUD ─────────────────────────────────────────────────
function today() {
  return new Date().toISOString().split('T')[0];
}
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,6);
}
function saveTransaction() {
  const desc = document.getElementById('f-desc').value.trim();
  const val = parseFloat(document.getElementById('f-val').value);
  const cat = document.getElementById('f-cat').value.trim();
  const date = document.getElementById('f-date').value;
  if (!desc) { showToast('Informe a descrição'); return; }
  if (!val || val <= 0) { showToast('Informe um valor válido'); return; }
  if (editingId) {
    const idx = transactions.findIndex(t => t.id === editingId);
    if (idx > -1) transactions[idx] = { ...transactions[idx], tipo: currentTipo, descricao: desc, valor: val, categoria: cat, data: date };
    showToast('Lançamento atualizado ✓');
  } else {
    transactions.push({ id: uid(), tipo: currentTipo, descricao: desc, valor: val, categoria: cat, data: date });
    showToast(`${currentTipo === 'receita' ? 'Receita' : 'Despesa'} adicionada ✓`);
  }
  save();
  closeModal();
  render();
}
function deleteTransaction(id) {
  if (!confirm('Excluir este lançamento?')) return;
  transactions = transactions.filter(t => t.id !== id);
  save();
  render();
  showToast('Lançamento excluído');
}
function editTransaction(id) {
  openModal(id);
}

// ─── TOAST ────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2400);
}

// ─── KEYBOARD ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'n') { e.preventDefault(); openModal(); }
  if (e.key === 'Enter' && document.getElementById('modal-overlay').classList.contains('open')) {
    if (document.activeElement !== document.querySelector('.btn-primary')) saveTransaction();
  }
});
document.getElementById('search').addEventListener('input', renderList);

// ─── HEADER DATE ──────────────────────────────────────────
function setHeaderDate() {
  const d = new Date();
  const opts = { weekday:'short', day:'2-digit', month:'short', year:'numeric' };
  document.getElementById('header-date').textContent = d.toLocaleDateString('pt-BR', opts);
}

// ─── INIT ─────────────────────────────────────────────────
load();
setHeaderDate();
render();
</script>
</body>
</html>
